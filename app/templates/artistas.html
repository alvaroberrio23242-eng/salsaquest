{% extends "base.html" %}
{% block title %}Artistas y Timba | SalsaQuest{% endblock %}

{% block content %}
    <section id="artistas-section" class="mb-5">
        <h3 class="text-warning fw-bold mb-3 titulo-seccion-glass"><i class="fa-solid fa-user-large me-2"></i>Historias: Artistas y Ritmos</h3>
        <div id="artistas-container" class="row g-4">
            <div class="text-center py-4"><div class="spinner-border text-warning" role="status"></div></div>
        </div>
    </section>

    <section id="timba-section">
        <h3 class="text-warning fw-bold mb-3 titulo-seccion-glass"><i class="fa-solid fa-drum me-2"></i>Timba</h3>
        <div id="timba-container">
            <div class="text-center py-4"><div class="spinner-border text-warning" role="status"></div></div>
        </div>
    </section>
{% endblock %}
