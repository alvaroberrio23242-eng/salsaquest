<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalsaQuest - Desafío de Trivia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-dark bg-black shadow mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="/">💃 SalsaQuest</a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house me-1"></i> Volver al Inicio</a>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <!-- Tarjeta de Juego -->
                <div id="quiz-card" class="card bg-secondary text-white shadow-lg border-0 rounded-4 p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="badge bg-warning text-dark fs-6" id="score-badge">Puntos: 0</span>
                        <span class="text-light" id="question-count">Pregunta 1</span>
                    </div>

                    <h3 id="question-text" class="fw-bold mb-4">Cargando desafío...</h3>

                    <!-- Opciones de Respuesta -->
                    <div id="options-container" class="d-grid gap-3">
                        <!-- Las opciones se generarán dinámicamente con JS -->
                    </div>

                    <!-- Mensaje de Retroalimentación -->
                    <div id="feedback" class="mt-4 text-center d-none"></div>

                    <button id="next-btn" class="btn btn-warning w-100 fw-bold mt-4 d-none">Siguiente Pregunta ➡️</button>
                </div>

                <!-- Tarjeta de Resultados -->
                <div id="result-card" class="card bg-secondary text-white shadow-lg border-0 rounded-4 p-5 text-center d-none">
                    <h1 class="display-4 fw-bold text-warning mb-3">🏆 ¡Desafío Completado!</h1>
                    <p class="fs-4">Tu puntuación final es: <strong id="final-score" class="text-info">0</strong></p>

                    <form onsubmit="guardarPuntajeDesafio(event)" class="mt-3 mb-2">
                        <div class="mb-3">
                            <input type="text" id="desafio-nombre" class="form-control bg-dark text-white border-0 text-center"
                                   placeholder="Tu nombre para el ranking" maxlength="50" required>
                        </div>
                        <button type="submit" id="btn-guardar-desafio" class="btn btn-success w-100 fw-bold">
                            💾 Guardar mi Puntaje
                        </button>
                        <p id="desafio-guardado-msg" class="small mt-2 text-success d-none"></p>
                    </form>

                    <div class="mt-2">
                        <button onclick="location.reload()" class="btn btn-warning btn-lg me-2">Intentar de nuevo</button>
                        <a href="/" class="btn btn-outline-light btn-lg">Volver al Inicio</a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Script de la lógica del Quiz -->
    <script src="{{ url_for('static', filename='js/trivia.js') }}"></script>
</body>
</html>
