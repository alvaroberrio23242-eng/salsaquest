<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | SalsaQuest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            width: 100%;
            max-width: 380px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 2.5rem 2rem;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.08);
        }
        .login-box h1 {
            font-family: var(--font-heading);
            color: var(--neon-gold);
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: .25rem;
        }
        .login-box .subtitulo {
            text-align: center;
            color: var(--text-muted);
            font-size: .85rem;
            margin-bottom: 1.75rem;
        }
        .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-light);
        }
        .form-control:focus {
            background: rgba(255,255,255,0.07);
            color: var(--text-light);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 .2rem rgba(0,240,255,0.15);
        }
        .btn-neon {
            background: linear-gradient(45deg, var(--neon-pink), var(--accent-red));
            border: none;
            color: white;
            font-weight: 600;
        }
        .btn-neon:hover { color: white; filter: brightness(1.1); }
    </style>
</head>
<body>

    <div class="login-box">
        <h1><i class="fa-solid fa-user-shield me-2"></i>Panel Admin</h1>
        <p class="subtitulo">SalsaQuest · Son Havana</p>

        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth_bp.admin_login') }}">
            <div class="mb-3">
                <label class="form-label small text-muted">Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="recordarme" name="recordarme" checked>
                <label class="form-check-label small text-muted" for="recordarme">
                    Recordar mi acceso en este dispositivo
                </label>
            </div>
            <button type="submit" class="btn btn-neon w-100 py-2 rounded-3">
                Entrar
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('main.index') }}" class="text-secondary small">
                <i class="fa-solid fa-arrow-left me-1"></i>Volver al sitio
            </a>
        </div>
    </div>

</body>
</html>
