<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | SalsaQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="form-container" style="max-width: 380px; width: 100%;">
        <h3 class="text-center text-warning fw-bold mb-4">
            <i class="fa-solid fa-lock me-2"></i>Acceso de administrador
        </h3>

        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="remember" id="remember">
                <label class="form-check-label" for="remember">
                    Recordar mi acceso en este dispositivo (30 días)
                </label>
            </div>
            <button type="submit" class="btn btn-trivia w-100">Entrar</button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('main.index') }}" class="small text-muted">&larr; Volver a SalsaQuest</a>
        </div>
    </div>
</body>
</html>
