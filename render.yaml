services:
  - type: web
    name: salsaquest
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: https://salsaquest.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: salsaquest-db
          property: connectionString

databases:
  - name: salsaquest-db
    plan: free
    databaseName: salsaquest
